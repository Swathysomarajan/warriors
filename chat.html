<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>NexLink | Messages</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .chat-layout { display: grid; grid-template-columns: 320px 1fr; height: 75vh; background: white; border-radius: 20px; border: 1px solid var(--border); overflow: hidden; }
        .contact-item { padding: 15px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .avatar-chat { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; cursor: pointer; }
    </style>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <a href="dashboard.html" class="logo">Nex<span>Link</span></a>
            <a href="dashboard.html" class="nav-item">🏠 Home Feed</a>
            <button class="nav-item active">💬 Messages</button>
            <a href="profile.html" class="nav-item">👤 Profile</a>
        </aside>

        <header class="header">
            <div class="search-bar">🔍 <input type="text" placeholder="Search contacts..."></div>
            <button onclick="alert('Group Created!')" style="background:var(--accent); color:white; border:none; padding:10px 20px; border-radius:10px; cursor:pointer; font-weight:600;">+ Create Group</button>
        </header>

        <main class="main-view">
            <div class="chat-layout">
                <div style="border-right: 1px solid var(--border); overflow-y:auto;">
                    <div class="contact-item">
                        <img src="https://i.pravatar.cc/150?u=1" class="avatar-chat" onclick="alert('Viewing full profile picture')">
                        <div><b>Sarah Jenkins</b><br><small>Active now</small></div>
                    </div>
                </div>
                <div style="display:flex; flex-direction:column; padding:20px;">
                    <div style="flex:1; background:#f8fafc; border-radius:15px; padding:15px;"><p><b>Sarah:</b> Did you see the new UI updates?</p></div>
                    <div style="display:flex; gap:10px; margin-top:15px;"><input type="text" style="flex:1; padding:12px; border:1px solid #ddd; border-radius:10px;"><button style="background:var(--accent); color:white; border:none; padding:12px 25px; border-radius:10px;">Send</button></div>
                </div>
            </div>
            <footer>&copy; 2026 NexLink Messaging</footer>
        </main>
    </div>
</body>
</html>
