<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NexLink | Social Feed</title>

<style>
:root{
    --accent:#6366f1;
    --border:#e5e7eb;
    --bg:#f1f5f9;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:var(--bg)}

.app-container{display:flex;min-height:100vh}

/* Sidebar */
.sidebar{
    width:260px;
    background:white;
    padding:2rem;
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
}
.logo{
    font-size:1.5rem;
    font-weight:800;
    text-decoration:none;
    color:#0f172a;
    margin-bottom:2rem;
}
.logo span{color:var(--accent)}

.nav-item{
    display:block;
    text-decoration:none;
    background:none;
    border:none;
    text-align:left;
    padding:12px;
    border-radius:10px;
    cursor:pointer;
    color:#64748b;
    margin-bottom:8px;
}
.nav-item:hover,.nav-item.active{
    background:#eef2ff;
    color:var(--accent);
    font-weight:600;
}

/* Header */
.header{
    position:fixed;
    left:260px;
    right:0;
    top:0;
    height:70px;
    background:white;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 25px;
    border-bottom:1px solid var(--border);
}

/* Main */
.main-view{
    margin-left:260px;
    padding:100px 30px 30px;
    width:100%;
}

/* Cards */
.blog-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
    gap:25px;
}
.card{
    background:white;
    border-radius:18px;
    overflow:hidden;
    border:1px solid var(--border);
}
.card-img{
    height:200px;
    background-size:cover;
}
.card-content{padding:20px}

/* Responsive */
@media(max-width:768px){
    .sidebar{display:none}
    .header{left:0}
    .main-view{margin-left:0}
}
</style>
</head>

<body>

<div class="app-container">

 <aside class="sidebar">
    <a class="logo" href="./index.html">Nex<span>Link</span></a>

    <button class="nav-item" onclick="window.location.href='./dashboard.html'">
        🏠 Home Feed
    </button>

    <button class="nav-item" onclick="window.location.href='./chat.html'">
        💬 Messages
    </button>

    <button class="nav-item" onclick="window.location.href='./profile.html'">
        👤 Profile
    </button>
</aside>


    <header class="header">
        <div>🔍 <input placeholder="Search NexLink..." style="padding:8px;border-radius:8px;border:1px solid var(--border)"></div>
        <div>🔔</div>
    </header>

    <main class="main-view">
        <h1>Home Feed</h1>

        <div class="blog-grid">
            <div class="card">
                <div class="card-img" style="background-image:url('https://images.unsplash.com/photo-1485827404703-89b55fcc595e?w=800')"></div>
                <div class="card-content">
                    <small style="color:var(--accent)">TECH</small>
                    <h3>The Future of AI</h3>
                </div>
            </div>
        </div>
    </main>

</div>

</body>
</html>
