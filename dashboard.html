<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>NexLink | Social Feed</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <a href="#" class="logo">Nex<span>Link</span></a>
            <button class="nav-item active" onclick="showView('home', this)">🏠 Home Feed</button>
             <a href="#" class="nav-item">💬 Messages</a>
            <button class="nav-item active">👤 Profile Settings</button>
            
            <a href="profile.html" class="nav-item">👤 Profile</a>
            <button onclick="logout()" class="nav-item" style="margin-top:auto; color:#f87171;">🚪 Logout</button>
        </aside>

        <header class="header">
            <div class="search-bar">🔍 <input type="text" placeholder="Search NexLink..." onkeyup="search()"></div>
            <div style="display:flex; align-items:center; gap:12px;">
                <span style="font-weight:700;">🔔 <small style="background:red; color:white; border-radius:50%; padding:2px 5px; font-size:10px;">2</small></span>
                <div style="width:40px; height:40px; background:var(--accent); border-radius:12px; color:white; display:flex; align-items:center; justify-content:center; font-weight:700;">U</div>
            </div>
        </header>

        <main class="main-view">
            <div class="view-content">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;">
                    <h1 id="viewTitle">Home Feed</h1>
                    <button onclick="openWrite()" style="background:var(--accent); color:white; border:none; padding:10px 20px; border-radius:10px; cursor:pointer; font-weight:600;">+ Create Group</button>
                </div>
                <div class="blog-grid" id="mainGrid"></div>
            </div>

            <footer>
                <p>&copy; 2026 NexLink. All rights reserved.</p>
                <p>Home • Saved • About • Activity</p>
            </footer>
        </main>
    </div>

    <script>
        const blogs = [
            { id: 1, cat: "TECH", title: "The Future of AI", img: "https://images.unsplash.com/photo-1485827404703-89b55fcc595e?w=800" },
            { id: 2, cat: "LIFE", title: "Minimalist Living", img: "https://images.unsplash.com/photo-1494438639946-1ebd1d20bf85?w=800" }
        ];

        function showView(view, btn) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            if(btn) btn.classList.add('active');
            document.getElementById('viewTitle').innerText = view.toUpperCase();
            const grid = document.getElementById('mainGrid');
            
            if(view === 'home') render(blogs);
            else if(view === 'activity') grid.innerHTML = "<p>• You viewed 'The Future of AI' at 10:30 AM</p>";
            else grid.innerHTML = `<p>No items in your ${view} list yet.</p>`;
        }

        function render(list) {
            const grid = document.getElementById('mainGrid');
            grid.innerHTML = '';
            list.forEach(p => {
                grid.innerHTML += `
                    <div class="card">
                        <div style="height:200px; background-image:url('${p.img}'); background-size:cover;"></div>
                        <div style="padding:20px;">
                            <span style="color:var(--accent); font-weight:800; font-size:0.7rem;">${p.cat}</span>
                            <h3 style="margin:10px 0;">${p.title}</h3>
                            <div style="display:flex; justify-content:space-between; margin-top:15px;">
                                <button onclick="alert('Liked!')" style="border:none; background:none; cursor:pointer;">❤ Like</button>
                                <button onclick="alert('Comment box opened')" style="border:none; background:none; cursor:pointer;">💬 Comment</button>
                            </div>
                        </div>
                    </div>`;
            });
        }
        render(blogs);
    </script>
</body>
</html>
