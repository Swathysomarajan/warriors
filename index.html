<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styled Web Page</title>
    
    <style>
        /* This is where the CSS begins */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            line-height: 1.6;
            padding: 40px;
            max-width: 800px;
            margin: auto;
        }

        h1 {
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }

        p {
            font-size: 18px;
        }

        ul {
            background: #fff;
            padding: 20px 40px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        a {
            color: #3498db;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            text-decoration: underline;
            color: #2980b9;
        }
    </style>
</head>
<body>

    <h1>Welcome to My Styled Website</h1>
    <p>With just a little bit of CSS, we've turned a plain text document into a designed page!</p>

    <ul>
        <li>Added a custom font (Arial)</li>
        <li>Centered the content on the screen</li>
        <li>Added a subtle shadow to this list</li>
    </ul>

    <p>Check out <a href="https://www.google.com">this link</a> to see the hover effect.</p>

</body>
</html>
