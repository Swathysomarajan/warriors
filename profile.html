<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexLink | Profile</title>

<style>
:root {
    --accent: #6366f1;
    --bg-color: #f1f5f9;
    --sidebar-width: 260px;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: 'Segoe UI', sans-serif;
    background-color: var(--bg-color);
    color: #1e293b;
}

/* Layout */
.app-container {
    display: flex;
    min-height: 100vh;
}

/* Sidebar */
.sidebar {
    width: var(--sidebar-width);
    background: white;
    border-right: 1px solid #e2e8f0;
    padding: 2rem;
    position: fixed;
    height: 100vh;
}

.logo {
    font-size: 1.6rem;
    font-weight: 800;
    color: #0f172a;
    text-decoration: none;
    margin-bottom: 2rem;
    display: block;
}

.logo span { color: var(--accent); }

.nav-item {
    display: block;
    width: 100%;
    border: none;
    background: none;
    text-align: left;
    padding: 0.8rem 1rem;
    margin-bottom: 0.5rem;
    border-radius: 10px;
    cursor: pointer;
    font-size: 1rem;
    color: #64748b;
}

.nav-item:hover,
.nav-item.active {
    background: #f1f5f9;
    color: var(--accent);
    font-weight: 600;
}

/* Main */
.main-view {
    margin-left: var(--sidebar-width);
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

/* Profile Card */
.profile-card {
    background: white;
    padding: 50px;
    border-radius: 30px;
    text-align: center;
    width: 90%;
    max-width: 480px;
    box-shadow: 0 20px 30px rgba(0,0,0,0.08);
}

.profile-pic {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    border: 4px solid var(--accent);
    object-fit: cover;
    cursor: pointer;
    transition: transform 0.3s;
}

.profile-pic:hover {
    transform: scale(1.08);
}

.stats {
    display: flex;
    justify-content: space-around;
    margin-top: 30px;
    border-top: 1px solid #eee;
    padding-top: 20px;
}

.stats div strong {
    font-size: 1.3rem;
}

.stats div p {
    font-size: 0.85rem;
    color: #64748b;
}

/* Button */
.edit-btn {
    margin-top: 25px;
    background: var(--accent);
    color: white;
    padding: 10px 25px;
    border-radius: 25px;
    border: none;
    cursor: pointer;
    font-size: 0.95rem;
}

.edit-btn:hover {
    opacity: 0.9;
}

/* Modal */
.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    justify-content: center;
    align-items: center;
}

.modal img {
    width: 300px;
    border-radius: 50%;
    border: 5px solid white;
}

.modal.active {
    display: flex;
}

/* Footer */
footer {
    margin-top: 20px;
    font-size: 0.85rem;
    color: #94a3b8;
}

/* Responsive */
@media(max-width: 768px) {
    .sidebar {
        display: none;
    }
    .main-view {
        margin-left: 0;
    }
}
</style>
</head>

<body>

<div class="app-container">
    <aside class="sidebar">
        <a class="logo" href="#">Nex<span>Link</span></a>
        <button class="nav-item">🏠 Home Feed</button>
        <button class="nav-item">💬 Messages</button>
        <button class="nav-item active">👤 Profile</button>
    </aside>

    <main class="main-view">
        <div class="profile-card">
            <img src="https://i.pravatar.cc/300?u=user"
                 class="profile-pic"
                 onclick="openModal()">

            <h2 style="margin-top:15px;">User Name</h2>
            <p style="color:#64748b;">Member since 2024</p>

            <div class="stats">
                <div>
                    <strong>24</strong>
                    <p>Posts</p>
                </div>
                <div>
                    <strong>1.5k</strong>
                    <p>Followers</p>
                </div>
                <div>
                    <strong>310</strong>
                    <p>Following</p>
                </div>
            </div>

            <button class="edit-btn">Edit Profile</button>
        </div>

        <footer>&copy; 2026 NexLink</footer>
    </main>
</div>

<!-- Profile Image Modal -->
<div class="modal" id="imgModal" onclick="closeModal()">
    <img src="https://i.pravatar.cc/300?u=user">
</div>

<script>
function openModal() {
    document.getElementById('imgModal').classList.add('active');
}
function closeModal() {
    document.getElementById('imgModal').classList.remove('active');
}
</script>

</body>
</html>
