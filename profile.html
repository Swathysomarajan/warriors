<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>NexLink | Profile</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <a href="dashboard.html" class="logo">Nex<span>Link</span></a>
            <a href="dashboard.html" class="nav-item">🏠 Home Feed</a>
            <a href="chat.html" class="nav-item">💬 Messages</a>
            <button class="nav-item active">👤 Profile Settings</button>

        <main class="main-view" style="align-items:center;">
            <div style="background:white; border:1px solid #eee; padding:60px; border-radius:30px; text-align:center; width:500px;">

                <h2>User Name</h2>
                <p style="color:#64748b;">Member since 2024</p>
                <div style="display:flex; justify-content:space-around; border-top:1px solid #eee; margin-top:30px; padding-top:20px;">
                    <div><strong>24</strong><p style="margin:0; font-size:0.8rem;">Posts</p></div>
                    <div><strong>1.5k</strong><p style="margin:0; font-size:0.8rem;">Followers</p></div>
                </div>
            </div>
            <footer>&copy; 2026 NexLink</footer>
        </main>
    </div>

</html>
