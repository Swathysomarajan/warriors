<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NexLink | Login</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-container { 
            display: flex; align-items: center; justify-content: center; 
            height: 100vh; background: var(--primary); 
        }
        .auth-card { 
            background: white; padding: 40px; border-radius: 24px; 
            width: 350px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        .auth-input { 
            width: 100%; padding: 12px; margin: 10px 0; border: 1px solid var(--border); 
            border-radius: 10px; box-sizing: border-box;
        }
        .auth-btn { 
            width: 100%; background: var(--dark); color: white; border: none; 
            padding: 14px; border-radius: 10px; cursor: pointer; font-weight: 700;
        }
    </style>
</head>
<body style="display: block; margin: 0;">
    <div class="auth-container">
        <div class="auth-card">
            <h2 class="logo" style="color: var(--dark); margin-bottom: 10px;">Nex<span>Link</span></h2>
            <p style="color: var(--text-muted); margin-bottom: 25px;">Welcome back!</p>
            
            <form id="loginForm">
                <input type="email" id="loginEmail" class="auth-input" placeholder="Email Address" required>
                <input type="password" id="loginPass" class="auth-input" placeholder="Password" required>
                <button type="submit" class="auth-btn">Sign In</button>
            </form>
            
            <p style="margin-top: 20px; font-size: 0.9rem;">
                New to NexLink? <a href="signup.html" style="color: var(--primary); text-decoration: none; font-weight: 600;">Create Account</a>
            </p>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPass').value;
            
            // Retrieve from Mock Database
            const storedUser = JSON.parse(localStorage.getItem('userDB'));
            
            if (storedUser && storedUser.email === email && storedUser.pass === pass) {
                // Set Active Session
                localStorage.setItem('session', 'active');
                localStorage.setItem('currentUser', JSON.stringify(storedUser));
                window.location.href = 'dashboard.html';
            } else {
                alert("Invalid email or password!");
            }
        });
    </script>
</body>
</html>
